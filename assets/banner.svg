<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glassmorphism Panel Gradient -->
    <linearGradient id="glass-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow-heavy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="glow-subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse-bg {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes flow-line {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes float-pill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes wave-bar {
      0%, 100% { transform: scaleY(0.6); }
      50% { transform: scaleY(1.1); }
    }
    @keyframes particle-orbit {
      0% { transform: rotate(0deg) translateX(60px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(60px) rotate(-360deg); }
    }

    .bg-pulse-1 { animation: pulse-bg 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .bg-pulse-2 { animation: pulse-bg 10s ease-in-out infinite 2s; transform-origin: 1000px 300px; }
    .anim-flow { stroke-dasharray: 12 12; animation: flow-line 15s linear infinite; }
    .float-1 { animation: float-pill 5s ease-in-out infinite; }
    .float-2 { animation: float-pill 6s ease-in-out infinite 1.5s; }
    .float-3 { animation: float-pill 7s ease-in-out infinite 3s; }
    .bar-1 { animation: wave-bar 3s ease-in-out infinite; transform-origin: bottom; }
    .bar-2 { animation: wave-bar 4s ease-in-out infinite 0.5s; transform-origin: bottom; }
    .bar-3 { animation: wave-bar 3.5s ease-in-out infinite 1s; transform-origin: bottom; }
  </style>

  <!-- Base Dark Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>
  <rect width="1200" height="400" fill="url(#grid)" rx="16"/>

  <!-- Dynamic Ambient Glow Blobs in Background -->
  <circle cx="180" cy="90" r="180" fill="#6366f1" opacity="0.25" filter="url(#glow-heavy)" class="bg-pulse-1" />
  <circle cx="1020" cy="310" r="200" fill="#a855f7" opacity="0.2" filter="url(#glow-heavy)" class="bg-pulse-2" />
  <circle cx="600" cy="200" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glow-heavy)" />

  <!-- Animated Data Flow Lines (Background Dynamic Layer) -->
  <g opacity="0.35">
    <path d="M -50 320 Q 300 260 600 340 T 1250 280" fill="none" stroke="url(#primary-glow)" stroke-width="3" class="anim-flow" />
    <path d="M -50 100 Q 400 180 800 80 T 1250 140" fill="none" stroke="url(#cyan-glow)" stroke-width="2" class="anim-flow" style="animation-duration: 20s;" />
  </g>

  <!-- Interactive Decorative Graphic Elements (Right side background graphic) -->
  <g transform="translate(860, 80)" opacity="0.85">
    <!-- Chart / Metric Visualization Box -->
    <rect x="0" y="0" width="260" height="180" rx="12" fill="url(#glass-card)" stroke="#475569" stroke-width="1" stroke-opacity="0.4"/>
    <text x="20" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">REVENUE LIFECYCLE ENGINE</text>
    
    <!-- Mini Flowchart Nodes -->
    <g transform="translate(20, 55)">
      <!-- Node 1: Quote -->
      <rect x="0" y="0" width="60" height="28" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
      <text x="30" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">CPQ</text>
      
      <!-- Arrow line -->
      <line x1="60" y1="14" x2="80" y2="14" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3 3"/>
      
      <!-- Node 2: Billing -->
      <rect x="80" y="0" width="60" height="28" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
      <text x="110" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Billing</text>

      <!-- Arrow line -->
      <line x1="140" y1="14" x2="160" y2="14" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3"/>

      <!-- Node 3: RevRec -->
      <rect x="160" y="0" width="60" height="28" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="190" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">ASC 606</text>
    </g>

    <!-- Dynamic Bar Chart Simulation -->
    <g transform="translate(20, 110)">
      <rect x="10" y="10" width="16" height="45" rx="3" fill="#6366f1" opacity="0.8" class="bar-1"/>
      <rect x="40" y="0" width="16" height="55" rx="3" fill="#8b5cf6" opacity="0.8" class="bar-2"/>
      <rect x="70" y="20" width="16" height="35" rx="3" fill="#ec4899" opacity="0.8" class="bar-3"/>
      <rect x="100" y="-5" width="16" height="60" rx="3" fill="#06b6d4" opacity="0.8" class="bar-1"/>
      <rect x="130" y="15" width="16" height="40" rx="3" fill="#10b981" opacity="0.8" class="bar-2"/>
      <path d="M 10 30 Q 40 5 70 25 T 146 10" fill="none" stroke="#f43f5e" stroke-width="2" filter="url(#glow-subtle)"/>
    </g>
  </g>

  <!-- Foreground Main Content Container with Dark Glass Backdrop for maximum text contrast -->
  <rect x="45" y="45" width="760" height="310" rx="14" fill="#0f172a" fill-opacity="0.65" stroke="#334155" stroke-width="1" stroke-opacity="0.6" filter="url(#glow-subtle)"/>

  <!-- Foreground Title and Subtitle Layer (STRICTLY ON TOP) -->
  <g transform="translate(75, 95)">
    <!-- Top Pill Badge -->
    <g class="float-1">
      <rect x="0" y="0" width="220" height="26" rx="13" fill="url(#primary-glow)" opacity="0.95"/>
      <text x="110" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">AWESOME CURATED LIST</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="65" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Revenue Lifecycle Management
    </text>
    
    <!-- Gradient Sub-Heading -->
    <text x="0" y="98" fill="url(#cyan-glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">
      Quote-to-Cash, Subscription Billing &amp; Open-Source
    </text>

    <!-- Description / Subtitle -->
    <text x="0" y="132" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" width="650">
      Comprehensive directory of enterprise SaaS platforms, open-source metering engines,
    </text>
    <text x="0" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      ASC 606 revenue recognition tools, and usage-based billing infrastructure.
    </text>

    <!-- Tag Pills Row (Foreground) -->
    <g transform="translate(0, 180)">
      <!-- Tag 1 -->
      <g class="float-2">
        <rect x="0" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
        <text x="57" y="17" fill="#c7d2fe" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Quote-to-Cash</text>
      </g>

      <!-- Tag 2 -->
      <g transform="translate(125, 0)" class="float-3">
        <rect x="0" y="0" width="145" height="26" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
        <text x="72" y="17" fill="#a5f3fc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Usage-Based Billing</text>
      </g>

      <!-- Tag 3 -->
      <g transform="translate(280, 0)" class="float-1">
        <rect x="0" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
        <text x="62" y="17" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">ASC 606 RevRec</text>
      </g>

      <!-- Tag 4 -->
      <g transform="translate(415, 0)" class="float-2">
        <rect x="0" y="0" width="140" height="26" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
        <text x="70" y="17" fill="#f5d0fe" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Open-Source Engines</text>
      </g>
    </g>
  </g>
</svg>
